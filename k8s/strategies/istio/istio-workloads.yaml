apiVersion: v1
kind: Namespace
metadata:
  name: aceest-istio
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-api-stable
  namespace: aceest-istio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-api
      version: stable
  template:
    metadata:
      labels:
        app: aceest-api
        version: stable
    spec:
      containers:
        - name: aceest-api
          image: aceest-fitness-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-api-candidate
  namespace: aceest-istio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-api
      version: candidate
  template:
    metadata:
      labels:
        app: aceest-api
        version: candidate
    spec:
      containers:
        - name: aceest-api
          image: aceest-fitness-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-api
  namespace: aceest-istio
spec:
  selector:
    app: aceest-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: aceest-api-gateway
  namespace: aceest-istio
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - aceest-api.example.com
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: aceest-api
  namespace: aceest-istio
spec:
  host: aceest-api
  subsets:
    - name: stable
      labels:
        version: stable
    - name: candidate
      labels:
        version: candidate
